name: Cinema XXI CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: nindyafr/cinema-cicd-demo:latest


deploy:
    needs: test-and-build
    runs-on: self-hosted

    steps:
      - name: Pull latest image
        run: docker pull nindyafr/cinema-cicd-demo:latest

      - name: Stop old container (if exists)
        run: docker stop cinema-app-container || true

      - name: Remove old container (if exists)
        run: docker rm cinema-app-container || true

      - name: Run new container
        run: docker run -d -p 5000:5000 --name cinema-app-container nindyafr/cinema-cicd-demo:latest

      - name: Verify deployment
        run: |
          sleep 3
          curl --fail http://localhost:5000/health
          curl --fail http://localhost:5000/movies